apiVersion: batch/v1
kind: Job
metadata:
  name: sbom-generator
  namespace: default
spec:
  backoffLimit: 1
  template:
    spec:
      nodeName: cks9640
      restartPolicy: Never
      containers:
        - name: trivy-sbom
          image: aquasec/trivy:latest
          command:
            - /bin/sh
            - -c
            - |
              trivy image \
                --format cyclonedx \
                --output /opt/course/1/sbom2.json \
                registry.k8s.io/kube-controller-manager:v1.31.0 && \
              trivy sbom \
                --format json \
                --output /opt/course/1/sbom_check_result.json \
                /opt/course/1/sbom_check.json
          volumeMounts:
            - name: course-dir
              mountPath: /opt/course/1
      volumes:
        - name: course-dir
          hostPath:
            path: /opt/course/1
            type: DirectoryOrCreate
